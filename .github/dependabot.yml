# Dependabot
#
# El repo tiene cero dependencias de runtime, asi que esto solo cubre las dos
# de desarrollo. Se puso porque una dependencia de desarrollo sin vigilance es
# una dependencia que se queda sin vigilar.
#
# Las actualizaciones abren pull requests, no commits: la revision es de una
# persona, y el guard decide si el cambio rompe algo.

version: 2
updates:
  - package-ecosystem: npm
    directory: /vibe-tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    # SOLO actualizaciones que no son mayores. Y no por prudencia generica:
    # MEDIDO. Un salto mayor del compilador DEGRADA LA VERIFICACION en
    # silencio, y la CI lo caza pero con un sintoma que parece de otra cosa.
    #   typescript 5 -> 7: el harness de mutacion deja de funcionar y los 142
    #     mutantes "sobreviven" todos, con cada paquete en 0%.
    #   @types/node 22 -> 26: 19 de 142 sobreviven y el total cae a 86.6%.
    # La causa es la misma: el harness muta el COMPILADO, y un cambio de
    # compilador cambia lo que se compila. El verificador se debilita sin que
    # nadie lo note, y el repo se niega a cerrar un loop con un verificador
    # debil.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
