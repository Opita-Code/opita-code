<!doctype html>
<!--
  SOCIAL PREVIEW — la imagen que se ve al compartir el enlace del repo.

  POR QUE ESTA EN HTML Y NO ES UN PNG SUELTO. Un PNG versionado es un
  archivo binario que no se puede revisar ni regenerar: nadie sabe que
  dice, y nadie sabe como se cambio. Aqui esta la fuente, y el PNG sale de
  aqui. `vibe-tools/tools/render-preview.mjs` lo produce.

  POR QUE NO HAY UNA SOLA FUENTE DE LETRA. El estado del arte de las imagenes
  de compartilhado es explicito: cero peticiones de red, solo fuentes del
  sistema, porque el render tiene que salir igual en cualquier maquina. La
  pila de la marca de Opita ya trae ese fallback ('Inter', system-ui, Segoe
  UI...), asi que se usa tal cual: si Inter esta instalada, sale Inter; si no,
  sale la del sistema. Y ningun CDN, porque una imagen que depende de la red
  no se puede reproducir.

  LAS MEDIDAS NO SON DECORATIVAS. Cada numero de aqui sale de la medicion:
  1280x640 es el lienzo (2:1, el que GitHub recorta sin perder nada), el
  nombre va a 76 px porque el feed muestra la miniatura a 400 px de ancho y
  por debajo de 24 px no se lee nada, y los tres colores son los de la
  paleta de Opita con su auditoria WCAG ya hecha: blanco sobre negro 19.7:1
  y verde de acento sobre negro 12.4:1, ambos AAA.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<title>Opita Code — social preview</title>
<style>
  :root {
    --ink: #0D0D0D;
    --paper: #FAFAFA;
    --accent: #00D084;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background-color: var(--ink);
    background-image: radial-gradient(1100px 560px at 14% -12%, rgba(0,208,132,0.16), rgba(13,13,13,0) 62%);
    color: var(--paper);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 76px;
  }
  .rule {
    width: 88px;
    height: 6px;
    background: var(--accent);
    margin-bottom: 34px;
  }
  h1 {
    font-size: 76px;
    line-height: 1.05;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  p {
    margin-top: 22px;
    font-size: 38px;
    line-height: 1.25;
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--accent);
  }
</style>
</head>
<body>
  <div class="rule"></div>
  <h1>Opita Code</h1>
  <p>vibe-studio runtime &middot; arquitectura &middot; cumplimiento</p>
</body>
</html>
